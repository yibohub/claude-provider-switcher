<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 供应商切换</title>
<style>
  :root {
    --bg-primary: #1a1b2e;
    --bg-secondary: #232438;
    --bg-card: #2a2b3d;
    --bg-hover: #33344d;
    --text-primary: #e8e8f0;
    --text-secondary: #9495b0;
    --border: #3a3b52;
    --success: #2ecc71;
    --danger: #e74c3c;
    --warning: #f39c12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px;
  }

  .container { max-width: 800px; margin: 0 auto; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); }

  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; }

  /* Section header with add button */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-add {
    background: var(--success);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-add:hover { opacity: 0.85; }

  /* 供应商卡片 */
  .provider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }

  .provider-card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .provider-card:hover { background: var(--bg-hover); transform: translateY(-1px); }
  .provider-card.active { border-color: var(--success); }

  .provider-card.active::after {
    content: '当前';
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--success);
    color: #fff;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* 卡片操作按钮 */
  .card-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .provider-card:hover .card-actions { opacity: 1; }
  .provider-card.active:hover .card-actions { right: 60px; }

  .card-actions button {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }

  .btn-card-edit { background: var(--warning); color: #333; }
  .btn-card-delete { background: var(--danger); color: #fff; }

  .provider-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff;
    margin-bottom: 12px;
  }

  .provider-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  .provider-url { font-size: 0.8rem; color: var(--text-secondary); word-break: break-all; margin-bottom: 12px; }

  .model-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .model-tag {
    background: var(--bg-primary);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    color: var(--text-secondary);
  }

  .model-tag span { color: var(--text-primary); font-weight: 500; }

  /* 配置信息 */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }

  .info-item {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .info-label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }
  .info-value { font-size: 0.95rem; font-weight: 500; word-break: break-all; }

  /* 切换历史 */
  .history-list { margin-bottom: 28px; }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-card);
    border-radius: 8px;
    margin-bottom: 6px;
  }

  .history-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .history-label { font-size: 0.85rem; flex: 1; }
  .history-time { font-size: 0.78rem; color: var(--text-secondary); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border-radius: 16px;
    padding: 28px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .form-group { margin-bottom: 14px; }

  .form-row {
    display: flex;
    gap: 12px;
  }

  .form-row .form-group { flex: 1; }

  .form-group label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
  }

  .form-group input:focus { border-color: var(--success); }

  .form-group input:read-only {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .form-group input[type="color"] {
    padding: 2px 4px;
    height: 38px;
    cursor: pointer;
  }

  .form-group input[type="text"].icon-input {
    width: 60px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .form-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--success); color: #fff; }
  .btn-cancel { background: var(--bg-card); color: var(--text-secondary); }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.9rem;
    color: #fff;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    z-index: 300;
    max-width: 400px;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--warning); color: #333; }

  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  .loading-overlay.show { display: flex; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--text-primary);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .provider-grid, .info-grid { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; }
    body { padding: 16px; }
  }

/* Tab 导航 */
.tab-nav {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  padding: 10px 20px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--text-primary); border-bottom-color: var(--success); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 健康状态灯 */
.health-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.health-dot.healthy { background: var(--success); }
.health-dot.degraded { background: var(--warning); }
.health-dot.unhealthy { background: var(--danger); }
.health-dot.unknown { background: var(--border); }

/* 代理面板 */
.proxy-panel { margin-bottom: 24px; }
.proxy-toggle { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.toggle-switch {
  position: relative; width: 48px; height: 26px; background: var(--border);
  border-radius: 13px; cursor: pointer; transition: background 0.3s;
}
.toggle-switch.on { background: var(--success); }
.toggle-switch::after {
  content: ''; position: absolute; width: 22px; height: 22px; background: #fff;
  border-radius: 50%; top: 2px; left: 2px; transition: transform 0.3s;
}
.toggle-switch.on::after { transform: translateX(22px); }
.proxy-info { background: var(--bg-card); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.proxy-tip {
  background: rgba(46, 204, 113, 0.1); border: 1px solid var(--success);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
  font-size: 0.85rem; color: var(--success); display: none;
}
.proxy-tip.show { display: block; }
.proxy-tip code { background: var(--bg-card); padding: 2px 6px; border-radius: 4px; font-family: monospace; }

/* 故障转移日志 */
.log-list { max-height: 300px; overflow-y: auto; }
.log-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--bg-card); border-radius: 6px; margin-bottom: 4px; font-size: 0.82rem;
}
.log-time { color: var(--text-secondary); flex-shrink: 0; }
.log-arrow { color: var(--warning); }
.log-reason { color: var(--danger); margin-left: auto; }

/* 健康监控卡片 */
.health-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.health-card { background: var(--bg-card); border-radius: 10px; padding: 16px; }
.health-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.health-card-name { font-weight: 600; font-size: 0.95rem; }
.health-card-latency { font-size: 0.82rem; color: var(--text-secondary); }
.health-models { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.health-model-tag { background: var(--bg-primary); padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; color: var(--text-secondary); }
.btn-check {
  background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; transition: opacity 0.2s;
}
.btn-check:hover { opacity: 0.85; }

/* 代理配置 */
.config-panel { background: var(--bg-card); border-radius: 10px; padding: 16px; }
.config-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.config-row label { font-size: 0.82rem; color: var(--text-secondary); min-width: 120px; }
.config-row input {
  width: 80px; padding: 6px 10px; background: var(--bg-primary);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 0.85rem; outline: none;
}
.config-row input:focus { border-color: var(--success); }
.btn-save-config { background: var(--success); color: #fff; border: none; padding: 6px 16px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }

/* 供应商卡片上的优先级和健康灯 */
.provider-priority {
  position: absolute; top: 12px; left: 12px; background: var(--bg-primary);
  color: var(--text-secondary); font-size: 0.7rem; padding: 1px 6px; border-radius: 8px;
}
.provider-health-dot { position: absolute; top: 12px; right: 12px; }
.provider-card.active .provider-health-dot { right: 60px; }

/* 延迟趋势图 */
.latency-chart { background: var(--bg-card); border-radius: 10px; padding: 16px; margin-bottom: 24px; min-height: 160px; }
.latency-chart-svg { width: 100%; height: 140px; }
.latency-chart-svg .bar { rx: 2; }
.latency-chart-svg .axis-line { stroke: var(--border); stroke-width: 0.5; }
.latency-chart-svg .label-text { fill: var(--text-secondary); font-size: 10px; font-family: sans-serif; }
.latency-chart-legend { display: flex; gap: 16px; margin-top: 8px; justify-content: center; }
.latency-chart-legend span { font-size: 0.78rem; color: var(--text-secondary); }
.latency-chart-legend .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

@media (max-width: 600px) {
  .health-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1><span class="dot" id="statusDot"></span>CC Switch Lite</h1>
  <p class="subtitle">Claude Code 供应商管理、代理转发与健康监控</p>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('providers')">供应商管理</button>
    <button class="tab-btn" onclick="switchTab('proxy')">代理服务</button>
    <button class="tab-btn" onclick="switchTab('health')">健康监控</button>
  </nav>

  <div id="tab-providers" class="tab-panel active">
    <div class="section-header">
      <div class="section-title">供应商</div>
      <button class="btn-add" onclick="openAddModal()">+ 添加供应商</button>
    </div>
    <div class="provider-grid" id="providerGrid"></div>
    <div class="section-title">当前配置</div>
    <div class="info-grid" id="infoGrid"></div>
    <div class="section-title">切换历史</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="tab-proxy" class="tab-panel">
    <div class="proxy-panel">
      <div class="proxy-toggle">
        <div class="toggle-switch" id="proxyToggle" onclick="toggleProxy()"></div>
        <span id="proxyStatusLabel">代理服务已关闭</span>
      </div>
      <div class="proxy-tip" id="proxyTip">
        请将 Claude Code 的 <code>ANTHROPIC_BASE_URL</code> 设为 <code>http://localhost:5000/proxy</code>
      </div>
      <div class="proxy-info" id="proxyInfo"></div>
      <div class="section-title">故障转移日志</div>
      <div class="log-list" id="failoverLog"></div>
    </div>
    <div class="section-title">代理配置</div>
    <div class="config-panel">
      <div class="config-row">
        <label>请求超时（秒）</label>
        <input type="number" id="cfgTimeout" value="30" min="5" max="120">
      </div>
      <div class="config-row">
        <label>最大尝试供应商</label>
        <input type="number" id="cfgMaxProviders" value="3" min="1" max="10">
      </div>
      <div class="config-row">
        <label>熔断阈值（次）</label>
        <input type="number" id="cfgCircuit" value="3" min="1" max="10">
      </div>
      <div class="config-row">
        <label></label>
        <button class="btn-save-config" onclick="saveProxyConfig()">保存配置</button>
      </div>
    </div>
  </div>

  <div id="tab-health" class="tab-panel">
    <div class="section-header">
      <div class="section-title">供应商健康状态</div>
      <button class="btn-check" onclick="checkAllHealth()">全部检测</button>
    </div>
    <div class="health-grid" id="healthGrid"></div>
    <div class="section-title">24h 延迟趋势</div>
    <div class="latency-chart" id="latencyChart"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加供应商</div>
    <form id="providerForm" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group">
          <label>供应商 ID（英文标识）</label>
          <input type="text" id="fName" placeholder="如 deepseek" pattern="[a-zA-Z0-9_-]+" required>
        </div>
        <div class="form-group">
          <label>显示名称</label>
          <input type="text" id="fLabel" placeholder="如 DeepSeek" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>颜色</label>
          <input type="color" id="fColor" value="#4A90D9">
        </div>
        <div class="form-group">
          <label>图标（单字符）</label>
          <input type="text" id="fIcon" class="icon-input" maxlength="2" placeholder="D">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>代理优先级（数字越小越优先）</label>
          <input type="number" id="fPriority" value="99" min="0" max="99">
        </div>
        <div class="form-group">
          <label>认证方式</label>
          <select id="fAuthType">
            <option value="x-api-key">x-api-key（Anthropic 兼容）</option>
            <option value="bearer">Bearer Token（OpenAI 兼容）</option>
          </select>
        </div>
      </div>

      <hr class="form-divider">

      <div class="form-group">
        <label>Auth Token</label>
        <input type="text" id="fAuthToken" placeholder="API 认证令牌">
      </div>
      <div class="form-group">
        <label>Base URL</label>
        <input type="text" id="fBaseUrl" placeholder="https://api.example.com/anthropic">
      </div>
      <div class="form-group">
        <label>Haiku 模型</label>
        <input type="text" id="fHaiku" placeholder="模型标识">
      </div>
      <div class="form-group">
        <label>Opus 模型</label>
        <input type="text" id="fOpus" placeholder="模型标识">
      </div>
      <div class="form-group">
        <label>Sonnet 模型</label>
        <input type="text" id="fSonnet" placeholder="模型标识">
      </div>
      <div class="form-group">
        <label>主模型 (ANTHROPIC_MODEL)</label>
        <input type="text" id="fMainModel" placeholder="如 deepseek-v4-pro（留空则不设置）">
      </div>
      <div class="form-group">
        <label>子代理模型</label>
        <input type="text" id="fSubagentModel" placeholder="如 deepseek-v4-flash（留空则不设置）">
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:10px">
        <label class="toggle-switch" id="fEffortToggle" onclick="this.classList.toggle('on')">
          <span></span>
        </label>
        <span>启用最大推理深度 (EFFORT_LEVEL=max)</span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button type="button" class="btn btn-primary" onclick="submitForm()">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
const $ = id => document.getElementById(id);
let currentId = '';
let editingId = null; // null = adding, string = editing
let providersRes_cache = null;

async function safeFetch(url, opts) {
  try {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res;
  } catch (e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('ERR_CONNECTION')) {
      await new Promise(r => setTimeout(r, 1000));
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res;
    }
    throw e;
  }
}

async function api(path, opts) {
  const res = await safeFetch('/api/' + path, opts);
  return res.json();
}

function showToast(msg, type = 'success', duration = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), duration);
}

function setLoading(on) {
  $('loading').classList.toggle('show', on);
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- Render ----

function renderProviders(providers, currentId) {
  $('providerGrid').innerHTML = providers.map(p => {
    const h = healthStatus[p.id];
    const healthClass = h ? h.status : 'unknown';
    return `
    <div class="provider-card ${p.id === currentId ? 'active' : ''}" onclick="doSwitch('${escapeHtml(p.id)}')">
      <span class="provider-priority">P${escapeHtml(String(p.priority || 99))}</span>
      <span class="provider-health-dot health-dot ${healthClass}"></span>
      <div class="card-actions">
        <button class="btn-card-edit" onclick="event.stopPropagation();openEditModal('${escapeHtml(p.id)}')" title="编辑">&#9998;</button>
        <button class="btn-card-delete" onclick="event.stopPropagation();doDelete('${escapeHtml(p.id)}')" title="删除">&#10005;</button>
      </div>
      <div class="provider-icon" style="background:${escapeHtml(p.color)}">${escapeHtml(p.icon)}</div>
      <div class="provider-name">${escapeHtml(p.label)}</div>
      <div class="provider-url">${escapeHtml(p.base_url)}</div>
      <div class="model-tags">
        <div class="model-tag">H: <span>${escapeHtml(p.models.haiku)}</span></div>
        <div class="model-tag">O: <span>${escapeHtml(p.models.opus)}</span></div>
        <div class="model-tag">S: <span>${escapeHtml(p.models.sonnet)}</span></div>
        ${p.models.main ? `<div class="model-tag">M: <span>${escapeHtml(p.models.main)}</span></div>` : ''}
        ${p.models.subagent ? `<div class="model-tag">SA: <span>${escapeHtml(p.models.subagent)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderSettings(settings) {
  $('infoGrid').innerHTML = `
    <div class="info-item">
      <div class="info-label">Base URL</div>
      <div class="info-value">${escapeHtml(settings.base_url)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">已启用插件</div>
      <div class="info-value">${settings.plugins.enabled} / ${settings.plugins.total}</div>
    </div>
    <div class="info-item">
      <div class="info-label">语言</div>
      <div class="info-value">${escapeHtml(settings.language)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">权限模式</div>
      <div class="info-value">${escapeHtml(settings.permission_mode)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">Haiku 模型</div>
      <div class="info-value">${escapeHtml(settings.models.haiku)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">Opus 模型</div>
      <div class="info-value">${escapeHtml(settings.models.opus)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">Sonnet 模型</div>
      <div class="info-value">${escapeHtml(settings.models.sonnet)}</div>
    </div>
    <div class="info-item">
      <div class="info-label">Hooks</div>
      <div class="info-value">${settings.has_hooks ? '已配置' : '未配置'}</div>
    </div>
  `;
}

function renderHistory(history) {
  if (!history.length) {
    $('historyList').innerHTML = '<div class="info-item" style="color:var(--text-secondary)">暂无切换记录</div>';
    return;
  }
  $('historyList').innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-dot" style="background:${escapeHtml(h.color)}"></div>
      <div class="history-label">${escapeHtml(h.label)}</div>
      <div class="history-time">${escapeHtml(h.timestamp)}</div>
    </div>
  `).join('');
}

// ---- Switch ----

async function doSwitch(name) {
  if (name === currentId) {
    showToast('当前已是该供应商', 'info');
    return;
  }
  setLoading(true);
  try {
    const res = await api(`switch/${name}`, { method: 'POST' });
    showToast(res.message, res.success ? 'success' : 'error');
    if (res.success) await refresh();
  } catch (e) {
    showToast('切换失败: ' + e.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ---- Modal ----

function openAddModal() {
  if ($('modalOverlay').classList.contains('show')) return;
  editingId = null;
  $('modalTitle').textContent = '添加供应商';
  $('fName').value = '';
  $('fName').readOnly = false;
  $('fLabel').value = '';
  $('fColor').value = '#4A90D9';
  $('fIcon').value = '';
  $('fPriority').value = '99';
  $('fAuthType').value = 'x-api-key';
  $('fAuthToken').value = '';
  $('fBaseUrl').value = '';
  $('fHaiku').value = '';
  $('fOpus').value = '';
  $('fSonnet').value = '';
  $('fMainModel').value = '';
  $('fSubagentModel').value = '';
  $('fEffortToggle').classList.remove('on');
  $('modalOverlay').classList.add('show');
  $('fName').focus();
}

async function openEditModal(name) {
  setLoading(true);
  try {
    const res = await api(`providers/${name}`);
    if (!res.success) {
      showToast(res.message, 'error');
      return;
    }
    const p = res.provider;
    editingId = name;
    $('modalTitle').textContent = '编辑供应商';
    $('fName').value = p.id;
    $('fName').readOnly = true;
    $('fLabel').value = p.label;
    $('fColor').value = p.color;
    $('fIcon').value = p.icon;
    $('fAuthToken').value = p.env.ANTHROPIC_AUTH_TOKEN || '';
    $('fBaseUrl').value = p.env.ANTHROPIC_BASE_URL || '';
    $('fHaiku').value = p.env.ANTHROPIC_DEFAULT_HAIKU_MODEL || '';
    $('fOpus').value = p.env.ANTHROPIC_DEFAULT_OPUS_MODEL || '';
    $('fSonnet').value = p.env.ANTHROPIC_DEFAULT_SONNET_MODEL || '';
    $('fMainModel').value = p.env.ANTHROPIC_MODEL || '';
    $('fSubagentModel').value = p.env.CLAUDE_CODE_SUBAGENT_MODEL || '';
    p.env.CLAUDE_CODE_EFFORT_LEVEL ? $('fEffortToggle').classList.add('on') : $('fEffortToggle').classList.remove('on');
    $('fPriority').value = p.priority || 99;
    $('fAuthType').value = p.auth_type || 'x-api-key';
    $('modalOverlay').classList.add('show');
  } catch (e) {
    showToast('加载供应商信息失败: ' + e.message, 'error');
  } finally {
    setLoading(false);
  }
}

function closeModal() {
  $('modalOverlay').classList.remove('show');
  editingId = null;
}

async function submitForm() {
  const name = $('fName').value.trim();
  const label = $('fLabel').value.trim();
  const color = $('fColor').value;
  const icon = $('fIcon').value.trim();
  const env = {
    ANTHROPIC_AUTH_TOKEN: $('fAuthToken').value.trim(),
    ANTHROPIC_BASE_URL: $('fBaseUrl').value.trim(),
    ANTHROPIC_DEFAULT_HAIKU_MODEL: $('fHaiku').value.trim(),
    ANTHROPIC_DEFAULT_OPUS_MODEL: $('fOpus').value.trim(),
    ANTHROPIC_DEFAULT_SONNET_MODEL: $('fSonnet').value.trim(),
    ANTHROPIC_MODEL: $('fMainModel').value.trim(),
    CLAUDE_CODE_SUBAGENT_MODEL: $('fSubagentModel').value.trim(),
    CLAUDE_CODE_EFFORT_LEVEL: $('fEffortToggle').classList.contains('on') ? 'max' : '',
  };
  const priority = parseInt($('fPriority').value) || 99;
  const auth_type = $('fAuthType').value;

  if (!name || !label) {
    showToast('供应商 ID 和显示名称不能为空', 'error');
    return;
  }

  setLoading(true);
  try {
    let res;
    if (editingId) {
      res = await api(`providers/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label, color, icon, env, priority, auth_type }),
      });
    } else {
      res = await api('providers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, label, color, icon, env, priority, auth_type }),
      });
    }

    showToast(res.message, res.success ? 'success' : 'error');
    if (res.success) {
      closeModal();
      await refresh();
    }
  } catch (e) {
    showToast('操作失败: ' + e.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ---- Delete ----

async function doDelete(name) {
  if (!confirm('确定要删除此供应商吗？')) return;
  setLoading(true);
  try {
    const res = await api(`providers/${name}`, { method: 'DELETE' });
    showToast(res.message, res.success ? 'success' : 'error');
    if (res.success) await refresh();
  } catch (e) {
    showToast('删除失败: ' + e.message, 'error');
  } finally {
    setLoading(false);
  }
}

// ---- Refresh ----

async function refresh() {
  try {
    const [providersRes, statusRes, historyRes] = await Promise.all([
      api('providers'),
      api('status'),
      api('history'),
    ]);
    providersRes_cache = providersRes;
    currentId = providersRes.current_id;
    $('statusDot').style.background = statusRes.current.color;
    renderProviders(providersRes.providers, currentId);
    renderSettings(statusRes.settings);
    renderHistory(historyRes.history);
    safeFetch('/api/health').then(r => r.json()).then(d => {
      healthStatus = d;
      renderProviders(providersRes.providers, currentId);
    }).catch(() => {});
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

// ---- Tab ----
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['providers','proxy','health'][i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  $('tab-' + name).classList.add('active');
  if (name === 'proxy') loadProxyPanel();
  if (name === 'health') loadHealthPanel();
}

// ---- Proxy ----
let proxyStatus = null;

async function loadProxyPanel() {
  try {
    const res = await api('proxy/status');
    proxyStatus = res;
    $('proxyToggle').classList.toggle('on', res.enabled);
    $('proxyStatusLabel').textContent = res.enabled ? '代理服务已启用' : '代理服务已关闭';
    $('proxyTip').classList.toggle('show', res.enabled);
    const current = res.current_provider || {};
    $('proxyInfo').innerHTML = `
      <div class="info-label">当前活跃供应商</div>
      <div class="info-value" style="color:${current.color || '#fff'}">${escapeHtml(current.label || '无')}</div>
      <div style="margin-top:8px">
        ${Object.entries(res.circuit_state || {}).map(([n, s]) =>
          `<span class="health-dot ${s.status}"></span> ${escapeHtml(n)}`
        ).join('&nbsp;&nbsp;')}
      </div>
    `;
    $('failoverLog').innerHTML = (res.failover_log || []).length
      ? res.failover_log.map(l => `
        <div class="log-item">
          <span class="log-time">${escapeHtml(l.timestamp || '')}</span>
          <span>${escapeHtml(l.from_provider || '')}</span>
          <span class="log-arrow">&rarr;</span>
          <span>${escapeHtml(l.to_provider || '')}</span>
          <span class="log-reason">${escapeHtml(l.reason || '')}</span>
        </div>
      `).join('')
      : '<div class="info-item" style="color:var(--text-secondary)">暂无故障转移记录</div>';
    const cfg = await (await safeFetch('/api/proxy/config')).json();
    $('cfgTimeout').value = cfg.timeout || 30;
    $('cfgMaxProviders').value = cfg.max_providers || 3;
    $('cfgCircuit').value = cfg.circuit_threshold || 3;
  } catch (e) {
    if (!e.message.includes('Failed to fetch')) showToast('加载代理状态失败: ' + e.message, 'error');
  }
}

async function toggleProxy() {
  const newState = proxyStatus ? !proxyStatus.enabled : true;
  try {
    const res = await api('proxy/toggle', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ enabled: newState }),
    });
    if (res.success) { showToast(res.message); await loadProxyPanel(); }
  } catch (e) { showToast('切换代理失败: ' + e.message, 'error'); }
}

async function saveProxyConfig() {
  try {
    const res = await api('proxy/config', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        timeout: parseInt($('cfgTimeout').value),
        max_providers: parseInt($('cfgMaxProviders').value),
        circuit_threshold: parseInt($('cfgCircuit').value),
      }),
    });
    if (res.success) showToast(res.message);
  } catch (e) { showToast('保存配置失败: ' + e.message, 'error'); }
}

// ---- Health ----
let healthStatus = {};
let healthPollTimer = null;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && healthPollTimer) loadHealthPanel({ silent: true });
});

async function loadHealthPanel(opts = {}) {
  const { silent = false, retry = false } = opts;
  try {
    const res = await safeFetch('/api/health');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    healthStatus = await res.json();
    renderHealthCards();
    loadLatencyChart();
    if (!healthPollTimer) { healthPollTimer = setInterval(() => loadHealthPanel({ silent: true }), 60000); }
  } catch (e) {
    if (!retry) { setTimeout(() => loadHealthPanel({ ...opts, retry: true }), 3000); return; }
    if (!silent) showToast('服务器连接失败，请检查服务是否运行', 'error', 5000);
  }
}

function renderHealthCards() {
  const providersRes = providersRes_cache;
  if (!providersRes) return;
  $('healthGrid').innerHTML = Object.entries(healthStatus).map(([name, info]) => {
    const p = (providersRes.providers || []).find(x => x.id === name);
    return `
    <div class="health-card">
      <div class="health-card-header">
        <span class="health-dot ${info.status}"></span>
        <span class="health-card-name">${escapeHtml(p ? p.label : name)}</span>
        <span class="health-card-latency">${info.latency_ms != null ? info.latency_ms + 'ms' : '-'}</span>
        <button class="btn-check" onclick="checkSingleHealth('${escapeHtml(name)}')">检测</button>
      </div>
      ${(info.models || []).length ? `<div class="health-models">${info.models.map(m => `<span class="health-model-tag">${escapeHtml(m)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}

async function checkSingleHealth(name) {
  try { await fetch(`/api/health/check/${name}`, { method: 'POST' }); await loadHealthPanel(); }
  catch (e) { showToast('检测失败: ' + e.message, 'error'); }
}

async function checkAllHealth() {
  try {
    const names = Object.keys(healthStatus);
    await Promise.all(names.map(n => fetch(`/api/health/check/${n}`, { method: 'POST' }).catch(() => {})));
    await loadHealthPanel();
  } catch (e) { showToast('检测失败: ' + e.message, 'error'); }
}

// ---- Latency Chart ----
async function loadLatencyChart() {
  try {
    const res = await safeFetch('/api/health/history');
    const data = await res.json();
    const history = data.history || [];
    if (!history.length) {
      $('latencyChart').innerHTML = '<div style="color:var(--text-secondary);text-align:center;padding:40px 0">暂无检测数据</div>';
      return;
    }
    const providersRes = providersRes_cache;
    const meta = {};
    (providersRes?.providers || []).forEach(p => { meta[p.id] = p; });
    const byProvider = {};
    history.forEach(h => { if (h.latency_ms != null) { (byProvider[h.provider] = byProvider[h.provider] || []).push(h); } });
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'latency-chart-svg');
    svg.setAttribute('viewBox', '0 0 800 140');
    svg.setAttribute('preserveAspectRatio', 'none');
    [0, 1, 2].forEach(i => {
      const y = 10 + i * 42;
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('class', 'axis-line');
      line.setAttribute('x1', '0'); line.setAttribute('y1', String(y));
      line.setAttribute('x2', '800'); line.setAttribute('y2', String(y));
      svg.appendChild(line);
    });
    ['0ms', '1000ms', '2000ms'].forEach((txt, i) => {
      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'label-text');
      text.setAttribute('x', '2'); text.setAttribute('y', String(8 + i * 42));
      text.textContent = txt;
      svg.appendChild(text);
    });
    const providerNames = Object.keys(byProvider);
    const groupWidth = Math.max(4, Math.min(12, 700 / providerNames.length));
    const maxPoints = Math.floor(700 / (groupWidth * providerNames.length));
    providerNames.forEach((name, pi) => {
      const entries = byProvider[name].slice(-maxPoints);
      const color = meta[name]?.color || '#888';
      entries.forEach((entry, ei) => {
        const x = 50 + ei * (groupWidth * providerNames.length) + pi * groupWidth;
        const barHeight = Math.min(120, Math.max(2, (entry.latency_ms / 3000) * 120));
        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('class', 'bar');
        rect.setAttribute('x', String(x)); rect.setAttribute('y', String(130 - barHeight));
        rect.setAttribute('width', String(groupWidth - 1)); rect.setAttribute('height', String(barHeight));
        rect.setAttribute('fill', color); rect.setAttribute('opacity', '0.7');
        rect.setAttribute('title', `${name}: ${entry.latency_ms}ms`);
        svg.appendChild(rect);
      });
    });
    $('latencyChart').innerHTML = '';
    $('latencyChart').appendChild(svg);
    const legend = document.createElement('div');
    legend.className = 'latency-chart-legend';
    providerNames.forEach(name => {
      const color = meta[name]?.color || '#888';
      legend.innerHTML += `<span><span class="legend-dot" style="background:${color}"></span>${escapeHtml(meta[name]?.label || name)}</span>`;
    });
    $('latencyChart').appendChild(legend);
  } catch (e) { $('latencyChart').innerHTML = '<div style="color:var(--text-secondary)">加载延迟趋势失败</div>'; }
}

// ESC to close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

refresh();
</script>
